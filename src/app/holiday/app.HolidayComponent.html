<div class="holiday-wrapper">
  <div class="month-wrapper">
    <button class="nav-button" (click)="prevMonth()" [disabled]="isAtMinMonth">&#60;</button>
    <div class="month">
      <h3>{{ currentMonth.name }}</h3>
    </div>
    <button class="nav-button" (click)="nextMonth()" [disabled]="isAtMaxMonth">&#62;</button>
  </div>


  <div class="pointer-wrapper">
    <div class="pointer-box">
      <h3>{{formatPointer("start")}}</h3>
    </div>
    <div class="pointer-box">
      <h3>{{formatPointer("end")}}</h3>
    </div>
  </div>

  <div class="day-wrapper">

    <div class="weekday" *ngFor="let day of weekdays">{{ day }}</div>
    <div *ngFor="let _ of getOffset(currentMonth)" class="day placeholder"></div>
    <div
      class="day"
      *ngFor="let day of getDaysInMonth(currentMonth)"
      [class.past]="isPastDay(currentMonthIndex, day)"
      [class.pointer]="isPointer(currentMonthIndex, day)"
      [class.between]="isBetween(currentMonthIndex, day)"
      [class.isHoliday]="isHoliday(currentMonthIndex, day)"
      (click)="togglePointer(currentMonthIndex, day)"
    >
      {{ day }}
    </div>
  </div>

  <button type="submit" class="holiday-button" (click)="planHolidays($event)">
    <h3> Planen </h3>
  </button>

  <div class="holiday-list-wrapper">
    <h3>Planned Holidays</h3>
    <div *ngIf="holidays.length === 0" class="no-holidays">
      No holidays planned.
    </div>
    <div class="holiday" *ngFor="let holiday of holidays">
      <div class="holiday-info">
        <span>{{formatDateWrapper(holiday.timestamp_start) }} → {{ formatDateWrapper(holiday.timestamp_end)}}</span>
      </div>
      <button class="delete-button" (click)="deleteHoliday($event, holiday.id)">Delete</button>
    </div>
  </div>
</div>
